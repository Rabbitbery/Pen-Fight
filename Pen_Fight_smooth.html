<style>
:root{--bg:#150d07;--card:rgba(24,16,10,.94);--ink:#f7ecd8;--sub:#b9a885;--line:rgba(255,232,190,.14);--gold:#f2b640;--gold2:#d9921c;--btn:#f2b640;--btn2:#e0553f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overscroll-behavior:none;touch-action:none;font-family:"Hind Siliguri",system-ui,sans-serif;font-weight:500;overflow:hidden;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none}
#w{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ov{z-index:5;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at 50% 28%,rgba(70,42,18,.5),rgba(10,6,3,.84));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#card{max-height:100%;overflow-y:auto;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 18px 18px;max-width:372px;width:100%;text-align:center;box-shadow:0 28px 70px #000b,inset 0 1px 0 rgba(255,232,190,.1);scrollbar-width:none}
#card::-webkit-scrollbar{display:none}
h1{margin:0 0 4px;font:800 32px/1.1 "Baloo Da 2","Hind Siliguri",sans-serif;letter-spacing:-.3px;color:var(--ink)}
p{margin:6px 0 14px;color:var(--sub);font-size:17px;line-height:1.4}
.brand{display:flex;align-items:center;gap:13px;margin:0 0 18px;text-align:left}
.brand svg{width:58px;height:58px;flex:none;filter:drop-shadow(0 6px 10px #0008)}
.wm b{display:block;font:800 38px/1 "Baloo Da 2","Hind Siliguri",sans-serif;letter-spacing:-.6px;color:var(--ink)}
.wm span{display:block;margin-top:3px;font-weight:600;font-size:15px;color:var(--gold)}
button{font:700 18px/1.2 "Hind Siliguri",system-ui,sans-serif;width:100%;min-height:54px;margin:8px 0 0;padding:10px 14px;border:0;border-radius:14px;color:#2b1904;background:linear-gradient(#f8c85c,#e3a12b);box-shadow:inset 0 1px 0 #fff7,0 4px 0 #9b6612,0 8px 16px #0006;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s}
button b{font-weight:800}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #fff7,0 1px 0 #9b6612}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button small{display:block;margin:2px 0 0;font:600 13px/1.2 "Hind Siliguri",sans-serif;color:inherit;opacity:.72;text-align:center}
.btnw{background:linear-gradient(#f8c85c,#e3a12b)}
.b2{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.b2:active{box-shadow:none}
button[style*="6b7391"]{background:transparent!important;color:var(--sub)!important;box-shadow:none!important;min-height:44px;border:0}
.row{display:flex;gap:6px;margin:0 0 4px}
.ch{flex:1;width:auto;min-height:42px;font-size:15px;font-weight:600;padding:8px 4px;margin:0;border-radius:12px;background:rgba(255,255,255,.05);color:var(--sub);border:1px solid var(--line);box-shadow:none;line-height:1.2}
.ch:hover{filter:none;background:rgba(255,255,255,.09)}
.ch:active{transform:scale(.97);box-shadow:none}
.ch.on{border-color:var(--gold);background:rgba(242,182,64,.15);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.sw{display:block;height:9px;border-radius:5px;margin:0 4px 6px}
img.sw{height:13px;width:calc(100% - 8px);object-fit:fill}
.sks{flex-wrap:wrap}.sks .ch{flex:1 0 28%}
.cls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cls .ch{padding:9px 2px;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
small{display:block;font-size:14px;font-weight:600;color:var(--sub);text-align:left;margin:16px 2px 8px}
small[style*="margin:-6px"]{text-align:center;margin:6px 0 4px!important;padding:9px 8px;font-size:13px;line-height:1.7;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px}
.bars{display:inline-flex;gap:2px;vertical-align:middle;margin:0 2px}
.bars u{width:10px;height:6px;border-radius:2px;background:rgba(255,255,255,.16)}
.bars u.on{background:var(--gold)}
.tg{position:absolute;top:8px;width:34px;height:34px;min-height:0;padding:0;margin:0;font-size:11px;border-radius:10px;color:#fff;background:rgba(20,13,8,.74);border:1px solid rgba(255,232,190,.24);box-shadow:none;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tg:active{transform:scale(.94);box-shadow:none}
.tg svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tg .sl{display:none;stroke:#ff7a66;stroke-width:2.6}.tg.off{border-color:rgba(255,232,190,.1)}.tg.off svg{opacity:.5}.tg.off .sl{display:block;opacity:1}
#bh{width:46px;border-radius:10px;font:700 14px "Hind Siliguri",system-ui,sans-serif;color:#1b2a5c}
.pl2{transform:rotate(180deg);margin-top:6px}
#cf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#ov.vw{background:radial-gradient(ellipse at 50% 30%,rgba(255,190,60,.34),rgba(14,8,2,.86))}
#ov.vl{background:radial-gradient(ellipse at 50% 30%,rgba(90,110,175,.22),rgba(8,6,16,.88))}
#card.pop{animation:pop .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes pop{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.vic svg.ic{width:92px;height:92px;display:block;margin:-4px auto 0;filter:drop-shadow(0 6px 10px #0006)}
.vic.w svg.ic{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(2deg)}}
.vt{font:800 44px/1.05 "Baloo Da 2","Hind Siliguri",sans-serif;margin:2px 0 0}
.vic.w .vt{color:var(--gold)}.vic.l .vt{color:#f08a78}
.vn{color:var(--sub);font-size:16px;margin:4px 0 12px;line-height:1.35}
.vsc{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 12px;font-size:15px}
.vsc b{font:800 38px/1 "Baloo Da 2",sans-serif;letter-spacing:1px;color:var(--ink);white-space:nowrap}
.vsc i{margin:0 6px;font-style:normal;opacity:.4}
.vsc span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.55;font-weight:600}
.vsc span.wn{opacity:1;font-weight:700;color:var(--gold)}
.vst{display:flex;gap:6px;margin:0 0 6px}
.vst span{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--sub);line-height:1.2}
.vst b{display:block;font:800 22px/1.2 "Baloo Da 2",sans-serif;color:var(--ink)}
.vimg{width:100%;height:96px;object-fit:cover;object-position:center;border-radius:12px;margin:0 0 10px;box-shadow:inset 0 0 0 1px var(--line)}
@media (max-height:520px){.vic svg.ic{width:56px;height:56px}.vt{font-size:34px}.vn{margin-bottom:6px;font-size:15px}.vimg{display:none}.vsc b{font-size:30px}.brand{margin-bottom:10px}}
.coinw{height:124px;perspective:700px;display:flex;align-items:center;justify-content:center;margin:2px 0 8px}
.coinw.jump{animation:cj 1.7s cubic-bezier(.3,.6,.4,1)}
@keyframes cj{0%{transform:translateY(0)}45%{transform:translateY(-46px) scale(1.18)}100%{transform:translateY(0)}}
.coin{width:104px;height:104px;position:relative;transform-style:preserve-3d;transition:transform 1.7s cubic-bezier(.2,.65,.25,1)}
.cfc{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font:800 22px "Baloo Da 2",sans-serif;color:#7a5200;letter-spacing:1px;background:radial-gradient(circle at 35% 30%,#fff0a8,#f2c230 55%,#c58f10);border:5px solid #e0a820;box-shadow:inset 0 0 0 3px #fff6c8aa,0 6px 12px #0004}
.cfc.tl{transform:rotateY(180deg);background:radial-gradient(circle at 35% 30%,#f4f4f4,#c9ced6 55%,#9097a3);border-color:#b8bec9;color:#3d4350;box-shadow:inset 0 0 0 3px #fffa,0 6px 12px #0004}
.tres{font-size:19px;margin:0 0 8px;color:var(--ink);line-height:1.3}

/* nostalgic school-notebook theme */

 const cp=H<460,bw=Math.min(W-16,560),bh=cp?44:58,by=cp?4:6;
 UI={cp,bx:(W-bw)/2,by,bw,bh,top:0,bot:0};
 UI.top=cp?by+bh+4:by+bh+4+26+6;UI.bot=cp?10:48;
}
function placeTools(){
 const ids=['bh','bp','bg2','bs','bm','bf'],tw=46+5*34+5*6;let a=UI.cp?UI.top+4:(W<520?8:(W-tw)/2);
 ids.forEach(id=>{const e=document.getElementById(id);if(!e)return;const w=id=='bh'?46:34,st=e.style;st.right='auto';

function mkMarks(fresh){
 const s=Math.min(dpr||1,1.5),o=fresh?null:mkC;
 mkC=document.createElement('canvas');mkC.width=Math.max(1,Math.round(P.w*s));mkC.height=Math.max(1,Math.round(P.h*s));
 mkX=mkC.getContext('2d');mkX.scale(s,s);if(o)try{mkX.drawImage(o,0,0,P.w,P.h)}catch(e){}
}
// strong hit -> small scratches on the wood + ink splatter, stored in desk coordinates
function mark(cx,cy,k,a,b,nx,ny){
 if(!mkX||sim||D.w<2)return;
 const qx=(cx-D.x)/D.w*P.w,qy=(cy-D.y)/D.h*P.h;if(qx<0||qy<0||qx>P.w||qy>P.h)return;
 const sf=Math.min(4,P.w/D.w),X=mkX,kk=Math.min(1,k/900),pw=Math.hypot(a.vx,a.vy)>=Math.hypot(b.vx,b.vy)?a:b,ink=COL[pw.i].g[0];
 snd.scratch(k);
 const ns=2+(Math.random()*3|0)+(k>650?2:0),tb=Math.atan2(nx,-ny);
 X.save();X.lineCap='round';
 for(let i=0;i<ns;i++){
  const an=tb+(Math.random()-.5)*1.3,len=(7+Math.random()*16)*(.6+kk)*sf,sx=qx+(Math.random()-.5)*14*sf,sy=qy+(Math.random()-.5)*14*sf,bd=(Math.random()-.5)*.6;
  const ex=sx+Math.cos(an)*len,ey=sy+Math.sin(an)*len,mx=(sx+ex)/2+Math.cos(an+1.57)*len*bd*.4,my=(sy+ey)/2+Math.sin(an+1.57)*len*bd*.4,o=.8*sf;
  X.strokeStyle='rgba(30,14,2,.5)';X.lineWidth=1*sf;X.beginPath();X.moveTo(sx,sy);X.quadraticCurveTo(mx,my,ex,ey);X.stroke();
  X.strokeStyle='rgba(255,236,200,.55)';X.lineWidth=.7*sf;X.beginPath();X.moveTo(sx+o,sy+o);X.quadraticCurveTo(mx+o,my+o,ex+o,ey+o);X.stroke();
 }
 X.restore();
 for(let i=0;i<5+kk*8;i++){const an=Math.random()*6.28,sp=50+Math.random()*kk*260;dots.push({x:cx,y:cy,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,r:.8+Math.random()*1.6,c:THEMES[theme].dust,l:.35+Math.random()*.3})}

}
// visual-only dynamics: wind-up while pulling, snap-back, hit wobble
function visUpd(rd){
 introT=Math.max(0,introT-rd);tFlash=Math.max(0,tFlash-rd*2.2);msgT+=rd;
 for(let i=0;i<2;i++)scPop[i]=Math.max(0,scPop[i]-rd*2.4);
 const n=2,h=rd/n;
 for(const p of pens){
  p.wp+=rd*(34+14*Math.min(1,p.wb));p.wb*=Math.exp(-rd*(p.fall?6:2.9));if(p.wb<.004)p.wb=0;
  let tx=0,ty=0,ta=0,k=1100,c=19;
  if(false){
   const dx=drag.g.x-drag.q.x,dy=drag.g.y-drag.q.y,u=Math.hypot(dx,dy);
   if(u>3){const m=pullM(drag.g,dx,dy,u).m/150,ux=dx/u,uy=dy/u,ax=Math.cos(p.a),ay=Math.sin(p.a);
    tx=-ux*m*p.L*.16;ty=-uy*m*p.L*.16;
    const t=((drag.g.x-p.x)*ax+(drag.g.y-p.y)*ay)/(p.L/2),cr=ax*uy-ay*ux;
    ta=Math.max(-1,Math.min(1,t))*cr*m*.22;k=380;c=24}
  }
  for(let s=0;s<n;s++){
   p.rvx+=((tx-p.rx)*k-p.rvx*c)*h;p.rvy+=((ty-p.ry)*k-p.rvy*c)*h;p.rx+=p.rvx*h;p.ry+=p.rvy*h;
   p.rav+=((ta-p.ra)*k*.8-p.rav*c)*h;p.ra+=p.rav*h;
  }
 }
}

function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function miniPen(c,cx,cy,len){
 const h=len/2;ctx.save();ctx.translate(cx,cy);ctx.rotate(-.45);ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=4;ctx.shadowOffsetY=2;
 if(c.im&&c.im.naturalWidth){const ih=Math.max(7,len*c.im.naturalHeight/c.im.naturalWidth*1.7);ctx.drawImage(c.im,-h,-ih/2,len,ih)}
 else{const g=ctx.createLinearGradient(0,-4,0,4);g.addColorStop(0,c.g[0]);g.addColorStop(.4,c.g[2]);g.addColorStop(1,c.g[1]);ctx.lineCap='round';ctx.strokeStyle=g;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-h+3,0);ctx.lineTo(h-3,0);ctx.stroke()}
 ctx.restore();
}
function instr(){
 const c=COL[turn].l;
 if(state==='aim'){
  if(mode==1&&turn==1)return[nm(1)+' ভাবছে'+'.'.repeat(1+(ft*2.5|0)%3),c];
  return[(mode==1?'তোমার পালা':nm(turn)+'-এর পালা')+' · কলম ধরে পেছনে টেনে ছেড়ে দাও',c];
 }
 if(state==='move')return['কলম ছুটছে…','#ffe27a'];
 if(state==='shrink')return['বেঞ্চ ছোট হচ্ছে!','#ff8a70'];
 if(state==='fall')return['কলম পড়ে গেল!','#ffe27a'];
 return['','#fff'];
}
const pcol=f=>'hsl('+(125-125*f)+',88%,56%)',pcolP=f=>'hsl('+(125-125*f)+',80%,40%)',inkOf=c=>c==='#ff8a70'?'#c23a30':'#1f2c5c',INK='#1f2c5c';
function pullF(){
 if(!drag)return 0;const dx=drag.o.x-drag.q.x,dy=drag.o.y-drag.q.y,u=Math.hypot(dx,dy);
 return u>3?pullM(drag.o,dx,dy,u).m/150:0;
}
function drawMeter(x,y,w,h,pf,t){
 ctx.save();ctx.textBaseline='middle';
 ctx.font=FNT(12);ctx.textAlign='left';ctx.fillStyle='#c23a30';ctx.fillText('শক্তি',x+4,y+h/2+1);
 const x0=x+44,x1=x+w-48,N=18,sw=(x1-x0)/N;
 for(let k=0;k<N;k++){const on=(k+.5)/N<=pf;ctx.fillStyle=on?pcolP((k+.5)/N):'rgba(31,44,92,.16)';rr(x0+k*sw+1,y+h/2-6,Math.max(1,sw-2),12,3);ctx.fill()}
 ctx.textAlign='right';const mx=pf>.97;ctx.font=FNT(14);ctx.fillStyle=mx?'#c23a30':pcolP(pf);
 ctx.fillText(mx?'MAX!':bn(Math.round(pf*100))+'%',x+w-4,y+h/2+1);
 ctx.restore();
}
function drawHUD(t){
 const U=UI,bx=U.bx,by=U.by,bw=U.bw,bh=U.bh,cp=U.cp;
 const cc=cp?Math.min(250,bw*.34):Math.max(84,Math.min(150,bw*.27)),cw=(bw-cc-8)/2,pf=pullF();
 ctx.save();ctx.textBaseline='middle';
 for(let i=0;i<2;i++){
  if(score[i]!==lastSc[i]){lastSc[i]=score[i];scPop[i]=1}
  const x=i?bx+bw-cw:bx,c=COL[i],act=(state==='aim'||state==='move')&&turn===i;
  ctx.save();
  const g=ctx.createLinearGradient(x,by,x,by+bh);g.addColorStop(0,act?'#fffbe6':'#fbf5e3');g.addColorStop(1,act?'#f3e8bf':'#eee3c3');
  if(act){ctx.shadowColor=c.b;ctx.shadowBlur=12+6*Math.sin(t/260)}
  ctx.fillStyle=INK;rr(x+2,by+3,cw,bh,9);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle=g;rr(x,by,cw,bh,9);ctx.fill();
  ctx.save();rr(x,by,cw,bh,9);ctx.clip();ctx.strokeStyle='rgba(47,111,219,.2)';ctx.lineWidth=1;for(let yy=by+9;yy<by+bh;yy+=9){ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+cw,yy);ctx.stroke()}ctx.restore();
  ctx.lineWidth=2.2;ctx.strokeStyle=INK;rr(x,by,cw,bh,9);ctx.stroke();
  if(act){ctx.lineWidth=2.5;ctx.strokeStyle=c.b;rr(x+3.5,by+3.5,cw-7,bh-7,6);ctx.stroke()}
  ctx.restore();
  const pw=cp?38:46,sw=cp?30:38,pad=8,L0=i==0;
  const penX=L0?x+pad+pw/2:x+cw-pad-pw/2,textX=L0?x+pad+pw+5:x+cw-pad-pw-5,scX=L0?x+cw-pad-sw/2:x+pad+sw/2;
  const avail=Math.max(20,cw-pad*2-pw-5-sw-4);
  miniPen(c,penX,by+bh/2,pw);
  // name
  let z=cp?14:16;ctx.font=FNT(z);while(z>10&&ctx.measureText(nm(i)).width>avail){z--;ctx.font=FNT(z)}
  ctx.textAlign=L0?'left':'right';ctx.fillStyle=act?'#14204a':'#4a557d';ctx.fillText(nm(i),textX,by+bh*(cp?.32:.33));
  // round pips
  const pr=cp?4:5,gp=pr*2+4,py=by+bh*(cp?.72:.7);
  for(let k=0;k<WIN;k++){
   const px=L0?textX+pr+k*gp:textX-pr-k*gp,on=k<score[i];
   ctx.beginPath();ctx.arc(px,py,pr,0,7);
   if(on){ctx.fillStyle=c.b;ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.stroke()}
   else{ctx.strokeStyle='rgba(31,44,92,.55)';ctx.lineWidth=1.4;ctx.stroke()}
  }
